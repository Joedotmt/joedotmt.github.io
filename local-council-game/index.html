<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00071d" />
    <meta
      name="description"
      content="A map-based guessing game for Malta's local councils."
    />
    <title>Malta LC Guessing Game</title>
    <link rel="manifest" href="app/app.webmanifest" />
    <link rel="icon" href="app/icon-512.png" />
    <link rel="apple-touch-icon" href="app/icon-512.png" />

    <!-- leaflet 1.9.4 -->
    <link rel="stylesheet" href="app/leaflet.css" />
    <script src="app/leaflet.js"></script>

    <!-- shp 6.1.0 -->
    <script src="app/shp.js"></script>

    <link rel="prefetch" href="app/pangolin1.woff2" />
    <link rel="prefetch" href="app/pangolin2.woff2" />

    <script src="app/tailwind.js"></script>
    <link rel="stylesheet" href="app/styles.css" />
  </head>

  <body class="bg-gray-100">
    <div
      style="position: fixed; bottom: 0; right: 0; z-index: 1001; color: white"
    >
      <img
        id="musictoggle"
        src="app/musicon.png"
        width="32"
        height="32"
        alt="Toggle background music"
        role="button"
        tabindex="0"
      />
    </div>

    <iframe
      style="display: none"
      id="achievementsIframe"
      src="/achievements.html"
    ></iframe>

    <a href="/" class="fixed-logo"
      ><img
        id="logoimg"
        src="app/joe-logo.webp"
        width="100"
        alt="Logo"
        class="logo"
    /></a>
    <p
      href="/"
      style="
        color: white;
        margin-left: 100px;
        margin-top: 15px;
        scale: 1;
        pointer-events: none;
      "
      class="fixed-logo"
    >
      Malta Local Council Guesser
    </p>

    <dialog
      id="start-overlay"
      open
      closedby="none"
      aria-labelledby="start-dialog-title"
      class="fixed inset-0 bg-black z-[2000] flex items-center justify-center"
    >
      <div class="start-dialog-brand">
        <a href="/" class="fixed-logo" aria-label="Home"
          ><img
            src="app/joe-logo.webp"
            width="100"
            alt=""
            class="logo"
        /></a>
        <p
          id="start-dialog-title"
          style="
            color: white;
            margin-left: 100px;
            margin-top: 15px;
            scale: 1;
            pointer-events: none;
          "
          class="fixed-logo"
        >
          Malta Local Council Guesser
        </p>
      </div>
      <a style="position: fixed; right: 0; top: 0; color: white" href="./coas/"
        >COA Directory</a
      >
      <div class="text-white text-5xl font-bold tracking-wider">
        <div style="font-size: 120px" id="countdown" class="hidden">3</div>
        <div
          id="noncountdown"
          style="display: flex; flex-direction: column; gap: 0.2em"
        >
          <button type="button" style="display: none" id="continueLastSave">
            Continue last save
          </button>
          <button type="button" id="normal-mode" autofocus>Normal Mode</button>
          <button type="button" id="mouseless-mode">Mouseless Mode</button>
          <button type="button" id="flags-mode">Guess the Flag Mode</button>
        </div>
      </div>
    </dialog>

    <div id="map"></div>

    <div
      id="flag-container"
      style="
        border-top-right-radius: 10px;
        z-index: 1001;
        border-bottom-right-radius: 10px;
        overflow: hidden;
        position: fixed;
        left: 0;
        bottom: 70px;
      "
      class="hidden my-4 p-2 bg-white/70 backdrop-blur-sm"
    >
      <img id="flag-image" src="" alt="Local Council Flag" class="h-40" />
    </div>

    <div
      style="
        width: 50vw;
        z-index: 1001;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
        overflow: hidden;
        position: fixed;
        right: 10px;
        top: 0;
      "
      class="bg-white/70 backdrop-blur-sm shadow-lg max-w-lg w-full text-center transition-all"
      id="info-box"
    >
      <div id="progress-container" class="mt-4">
        <p class="text-lg font-semibold text-gray-700">
          Time:
          <span
            style="font-family: monospace"
            class="text-blue-600"
            id="stopwatch"
            >00:00.00</span
          ><br />Progress:
          <span
            id="progress-text"
            class="font-bold text-blue-600"
            aria-live="polite"
            >0 / 0</span
          >
        </p>
        <div class="w-full bg-gray-200 h-2.5 mt-2">
          <div
            id="progress-bar"
            class="bg-blue-600 h-2.5"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </div>

    <dialog id="guess-dialog" aria-label="Guess the selected locality">
      <input
        autocomplete="off"
        type="text"
        id="guess-input"
        style="opacity: 1"
        class="w-full px-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="Enter name..."
      />
    </dialog>

    <div
      id="win-modal"
      class="hidden absolute inset-0 z-[1002] bg-green-500/80 flex items-center justify-center p-4 text-white text-center"
    >
      <div
        class="transform transition-all scale-95 opacity-0"
        id="win-modal-content"
      >
        <h1 class="text-6xl font-bold mb-4">🎉 You Win! 🎉</h1>
        <p class="text-2xl mb-6">You've successfully named all the councils!</p>
        <p class="text-2xl mb-6">
          Final Time: <span id="final-time">00:00.00</span>
        </p>
        <button
          type="button"
          id="play-again"
          class="bg-white text-green-600 font-bold py-3 px-8 rounded-full text-lg hover:bg-gray-100 transition-transform hover:scale-105"
        >
          Play Again
        </button>
      </div>
    </div>

    <script type="module" src="app/app.js"></script>
  </body>
</html>
