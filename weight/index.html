<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Cache-Control" content="no-cache" />
		<title>Weight Loss Competition Tracker</title>
		<link rel="icon" href="favicon.ico" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,500..700;1,500..700&display=swap"
			rel="stylesheet" />

		<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.25.0/pocketbase.umd.js"></script>
		<script defer src="app.js?v=20"></script>

		<link
			href="https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.css"
			rel="stylesheet" />
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.js"></script>
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>

		<link rel="stylesheet" href="styles.css?v=14" />
	</head>

	<body class="light">
		<nav class="tracker-links" aria-label="Tracker utilities">
			<a href="./privacy/">Privacy Notice</a>
			<button type="button" class="ripple" onclick="toggleHiddenWeights()">
				Toggle Smoothing
			</button>
		</nav>
		<header
			style="
				flex-direction: row;
				align-items: center;
				justify-content: space-between;
			">
			<h1 style="margin: 1em 0em; margin-right: 1em">
				Weight Loss Competition Tracker
			</h1>
			<button id="signinbutton" onclick="signOut()" disabled>Sign Out</button>
		</header>

		<dialog
			class="max"
			style="
				justify-content: center;
				align-items: center;
				align-content: center;
			"
			id="signindialog">
			<div id="sid_progress" style="display: none">
				<progress id="sid_progressbar" class="circle large"></progress>

				<div style="display: contents" id="loadingtext">
					<div>AAAAAAAAAA</div>
					<div>LOADING.. .</div>
					<div>GOTTA GO FAST</div>
					<div>URANIUM TIME</div>
					<div>200000 calories</div>
					<div>!!!!!!!!!!!</div>
					<div>FATASS</div>
					<div>BRRRRRR</div>
					<div>WOAMAAPAO</div>
					<div>HELP HELP HELP</div>
					<div>92.251.80.174</div>
				</div>
			</div>
			<div id="sid_words" style="display: none">
				<h5 style="text-align: center">Who are you?</h5>
				<nav id="participantButtons" class="center-align">
					<form
						id="signinForm"
						style="display: flex; flex-direction: column; gap: 1em">
						<div style="margin: 0" class="field label suffix border">
							<input
								type="text"
								autocomplete="off"
								id="usernameInput"
								required />
							<label for="usernameInput">Username</label>
							<i>person</i>
						</div>

						<div style="margin: 0" class="field label suffix border">
							<input
								id="passwordInput"
								type="password"
								autocomplete="current-password"
								required />
							<label for="passwordInput">Password</label>
							<i>password</i>
						</div>

						<p id="signinNotice" role="status" hidden></p>
						<button type="submit">
							Sign In
						</button>
						<button type="button" id="guestSignInButton">
							Sign in as Guest
						</button>
					</form>
				</nav>
			</div>
		</dialog>

		<main style="display: flex; flex-direction: column">
			<div style="display: flex; margin: 1em; align-items: center">
				<h1 style="text-align: center; width: 50%" id="welcomeText">Hello</h1>

				<button
					style="width: 50%; box-sizing: border-box"
					type="button"
					id="logweightbutton"
					disabled>
					Log Weight
				</button>
			</div>
			<div class="tracker-layout">
				<div class="tracker-chart">
					<p id="competitionNotice" role="status" hidden></p>
					<p id="chartNotice" role="status" hidden></p>
					<div class="tabs" id="GraphTabs" role="group" aria-label="Chart mode">
						<button type="button" class="ripple" value="Absolute" aria-pressed="true">Absolute</button>
						<button type="button" class="ripple" value="Relative" aria-pressed="false">Relative</button>
						<button type="button" class="ripple" value="Progress" aria-pressed="false">Progress</button>
					</div>
					<div class="tracker-plot">
						<canvas id="ProgressGraph"></canvas>
					</div>
				</div>
				<div id="recordList"></div>
			</div>

			<div id="competitionControls" class="competition-controls" hidden>
				<div class="competition-toolbar">
					<label for="competitionSelect">Competition</label>
					<select id="competitionSelect">
						<option value="">All Friends</option>
					</select>
					<button type="button" id="newCompetitionButton">
						New Competition
					</button>
				</div>
			</div>
		</main>
		<div id="weightSaveToast" role="status"></div>

		<dialog id="weightFormDialog" class="max" aria-labelledby="weightFormTitle">
			<h2 id="weightFormTitle" style="margin-bottom: 1em">Log Weight</h2>

			<form id="weightForm">
				<div style="padding: 1em">
					<div style="margin: 0" class="field label suffix border">
						<input type="number" id="weightInput" inputmode="decimal" step="any" required autofocus />
						<label for="weightInput">Weight (kg)</label>
						<i>scale</i>
					</div>
					<p id="weightFormNotice" role="status"></p>
				</div>

				<nav class="right-align">
					<button type="button" id="cancelWeightButton" class="border">Cancel</button>
					<button type="submit" id="submitButton">Submit</button>
				</nav>
			</form>
		</dialog>

		<dialog id="competitionDialog" aria-labelledby="competitionDialogTitle">
			<h2 id="competitionDialogTitle">New Competition</h2>
			<form id="competitionForm">
				<fieldset class="competition-friends">
					<legend>Friends to include</legend>
					<div id="competitionFriends"></div>
				</fieldset>
				<div class="field label border">
					<input type="text" id="competitionName" maxlength="80" />
					<label for="competitionName">Name (optional)</label>
				</div>
				<div class="field label border">
					<input type="date" id="competitionStartDate" required />
					<label for="competitionStartDate">Start Date</label>
				</div>
				<p id="competitionFormNotice" role="status" hidden></p>
				<nav class="right-align">
					<button type="button" id="cancelCompetitionButton" class="border">
						Cancel
					</button>
					<button type="submit" id="createCompetitionButton">Create</button>
				</nav>
			</form>
		</dialog>
	</body>
</html>
